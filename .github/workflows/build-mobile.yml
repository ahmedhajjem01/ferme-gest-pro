name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔄 Sync Capacitor Web Assets
        run: npm run sync

      - name: 🔨 Grant execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FermeGestPro.apk

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FermeGestPro-Android-APK
          path: FermeGestPro.apk
          retention-days: 30

      - name: 🏷️ Publish APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-app
          name: FermeGest Pro Android APK (Latest)
          body: |
            ### 📱 FermeGest Pro - Application Mobile Android
            
            Téléchargez et installez l'application officielle sur votre smartphone Android :
            
            1. Cliquez sur **`FermeGestPro.apk`** ci-dessous pour lancer le téléchargement.
            2. Ouvrez le fichier téléchargé sur votre téléphone.
            3. Si Android vous demande d'autoriser l'installation depuis des sources inconnues, acceptez.
            4. Profitez de FermeGest Pro avec toutes les fonctions natives (vibrations haptiques, alertes locales d'incubateur, stockage local & Cloud Supabase) !
          files: |
            FermeGestPro.apk

  build-ios:
    name: 🍎 Build iOS Project
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔄 Sync Capacitor Web Assets
        run: npm run sync

      - name: 🔨 Build Xcode Project (No Code Sign)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📤 Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FermeGestPro-iOS-Build
          path: ios/App/build/
          retention-days: 14
